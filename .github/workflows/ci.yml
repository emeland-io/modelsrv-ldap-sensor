# Runs on main as mirrored from GitLab. Pull requests are not used on GitHub
# (GitLab is the source), so there is no pull_request trigger. Unlike GitLab
# CI, the GitHub runner has Docker, so the OpenLDAP integration test runs here.
name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Lint
        run: make lint

      - name: Build
        run: go build -v ./...

      - name: Test (including OpenLDAP integration test)
        run: go test -v -count=1 ./...
