# Downstream model servers that receive the Identity and Group events.
subscribers:
  - "http://localhost:24000/api/"

# How often the directory is scanned. Defaults to 5m when unset.
pollInterval: 5m

ldap:
  url: "ldap://localhost:389"
  # Leave bindDN empty for an anonymous bind. The password can also be given
  # through the LDAP_BIND_PASSWORD environment variable.
  bindDN: "cn=admin,dc=example,dc=org"
  bindPassword: "admin"
  # startTLS: true
  # caFile: /etc/ssl/ldap-ca.pem
  pageSize: 500

identities:
  baseDN: "ou=people,dc=example,dc=org"
  filter: "(objectClass=inetOrgPerson)"
  nameAttribute: cn
  # idAttribute: entryUUID   # stable id on OpenLDAP; objectGUID on AD

groups:
  baseDN: "ou=groups,dc=example,dc=org"
  filter: "(objectClass=groupOfNames)"
  nameAttribute: cn
  memberAttribute: member
